<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <title>Track your order — {brand}</title>
  <meta name="description" content="Track your order, download your invoice, or request a return or exchange.">
  <script type="module" src="/js/track.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main id="main" class="page">
    <div class="wrap track-box">
      <div class="page-head"><span class="eyebrow">Orders</span><h1>Track your order</h1><p>Enter your order number and the mobile number you used at checkout. You can also download your invoice and request a return here.</p></div>
      <form class="card-box" data-lookup style="display:grid;gap:16px">
        <div class="grid-2">
          <div class="field"><label for="num">Order number</label><input id="num" name="number" placeholder="e.g. VA10001" required autocapitalize="characters"></div>
          <div class="field"><label for="ph">Mobile number</label><input id="ph" name="phone" inputmode="numeric" maxlength="10" required></div>
        </div>
        <div data-error role="alert"></div>
        <button class="btn" type="submit">Find my order</button>
      </form>
      <div data-result></div>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
