<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <title>Bulk orders — {brand}</title>
  <meta name="description" content="Ordering more than 10 pieces? Tell us what you need and we will get back to you with pricing and timelines.">
  <script type="module" src="/js/bulk.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main id="main" class="page">
    <div class="wrap track-box">
      <div class="page-head"><span class="eyebrow">Bulk &amp; corporate</span><h1>Ordering in bulk?</h1><p data-bulk-intro>Online orders are limited per item. For larger quantities, for teams, events, weddings or stores, tell us what you need and we will reply with pricing and timelines.</p></div>
      <form class="card-box" data-form style="display:grid;gap:16px">
        <div class="grid-2">
          <div class="field"><label for="n">Your name</label><input id="n" name="name" autocomplete="name" required></div>
          <div class="field"><label for="p">Mobile number</label><input id="p" name="phone" inputmode="numeric" maxlength="10" required></div>
        </div>
        <div class="grid-2">
          <div class="field"><label for="e">Email (optional)</label><input id="e" name="email" type="email"></div>
          <div class="field"><label for="q">Approximate quantity</label><input id="q" name="quantity" type="number" min="1" inputmode="numeric"></div>
        </div>
        <div class="field"><label for="pr">Which products?</label><input id="pr" name="product" data-product></div>
        <div class="field"><label for="m">Anything else (sizes, colours, deadline)</label><textarea id="m" name="message"></textarea></div>
        <div data-error role="alert"></div>
        <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" type="submit">Send enquiry</button><a class="btn ghost" data-wa target="_blank" rel="noopener">WhatsApp instead</a></div>
      </form>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
