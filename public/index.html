<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{brand} — Shop shirts, kurtas &amp; more online | Made in Tiruppur</title>
  <meta name="description" content="Shop clothes made by our family workshop in Tiruppur. Free shipping above ₹1,999, cash on delivery across India and 7-day easy returns.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ramani Tex — Made in Tiruppur">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/home.css">
  <script type="module" src="/js/home.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <!-- All text, banners and images on this page are edited in Admin › Homepage.
       The first active banner is the hero. Any further banners appear as offer tiles below. -->
  <main id="main">
    <section class="hero" data-hero aria-label="Featured">
      <div class="hero-copy"><div class="skeleton" style="height:320px"></div></div>
    </section>

    <section class="wrap block" data-section="categories">
      <div class="block-head"><h2 data-title></h2></div>
      <div class="cat-grid" data-cats></div>
    </section>

    <section class="wrap block" data-section="newArrivals">
      <div class="block-head"><h2 data-title></h2><a class="link" href="/shop?sort=new">View all</a></div>
      <div class="product-grid" data-arrivals></div>
    </section>

    <section class="wrap block promos" data-section="promos" data-promos></section>

    <section class="wrap block" data-section="trending">
      <div class="block-head"><h2 data-title></h2><a class="link" href="/shop">View all</a></div>
      <div class="product-grid" data-trending></div>
    </section>

    <section class="block story-band" data-section="story">
      <a class="wrap story-strip" href="/story">
        <div class="story-img"><img src="/media/illustrations/hero.svg" alt="" loading="lazy" data-story-img></div>
        <div class="story-copy">
          <span class="eyebrow">Our story</span>
          <h2 data-title></h2>
          <p data-story-text></p>
          <span class="story-link">Read our story <span aria-hidden="true">→</span></span>
        </div>
      </a>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
