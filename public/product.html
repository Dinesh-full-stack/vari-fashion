<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <title>Product — {brand}</title>
  <meta name="description" content="">
  <script type="module" src="/js/product.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main id="main" class="page">
    <!--SSR-PRODUCT-->
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a> / <a href="/shop">Shop</a> / <span data-crumb></span></nav>
      <div class="pdp" data-pdp>
        <div class="gallery" data-gallery><figure class="skeleton"></figure></div>
        <div class="buybox" data-buybox></div>
      </div>
      <div class="section-title"><h2>You may also like</h2><a class="link" href="/shop">Shop all</a></div>
      <div class="product-grid" data-similar></div>
    </div>
    <script type="application/json" id="product-data">"__PRODUCT_JSON__"</script>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
